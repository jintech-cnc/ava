{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Mot de passe changé" %}{% endblock %}
{% block content %}
<div class="auth-screen">
    <div class="auth-card">
        <div class="auth-card__brand">
            <span class="brand-mark brand-mark--lg">A</span>
            <h1>{% trans "Mot de passe changé" %}</h1>
        </div>

        <div class="alert alert--success">
            <p>{% trans "Votre mot de passe a été réinitialisé avec succès." %}</p>
        </div>

        <a href="{% url 'accounts:login' %}" class="btn btn--primary btn--block">{% trans "Se connecter" %}</a>
    </div>
</div>
{% endblock %}
