{% load i18n %}
{% get_current_language as CURRENT_LANG %}
{% get_available_languages as AVAILABLE_LANGUAGES %}
{% get_language_info_list for AVAILABLE_LANGUAGES as languages %}
<div class="lang-switcher" x-data="{ open: false }">
    <button type="button" class="nav-link lang-switcher__toggle" @click="open = !open">
        <span class="nav-icon">🌐</span>
        <span class="lang-label">{{ CURRENT_LANG|upper }}</span>
        <span class="lang-caret">▾</span>
    </button>

    <!-- Menu avec UN seul formulaire pour CSRF propre -->
    <form class="lang-switcher__menu"
          action="{% url 'set_language' %}"
          method="POST"
          x-show="open"
          x-cloak
          @click.outside="open = false">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}">

        {% for lang in languages %}
        <button type="submit"
                name="language"
                value="{{ lang.code }}"
                class="lang-switcher__item {% if lang.code == CURRENT_LANG %}lang-switcher__item--active{% endif %}"
                @click="open = false">
            {{ lang.name_local }}
        </button>
        {% endfor %}
    </form>
</div>
