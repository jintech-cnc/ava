{% extends "base.html" %}
{% load i18n static %}
{% block title %}{% trans "Point de Vente" %}{% endblock %}
{% block page_title %}{% trans "Point de Vente (POS)" %}{% endblock %}
{% block content %}
<div class="pos-app" x-data="posData()" x-init="init()">
    <div class="pos-grid">
        <div class="pos-products">
            <div class="toolbar">
                <input type="text" class="input input--search" placeholder='{% trans "Rechercher un produit..." %}' 
                       x-model="searchQuery" x-ref="searchInput" 
                       @keydown="if($event.key === 'Enter') $event.preventDefault()">
            </div>
            
            <div class="category-tabs" x-show="categories.length > 0">
                <button class="category-tab" :class="!selectedCategory ? 'category-tab--active' : ''" 
                        @click="selectedCategory = null">{% trans "Toutes" %}</button>
                <template x-for="cat in categories" :key="cat.id">
                    <button class="category-tab" 
                            :class="selectedCategory === cat.id ? 'category-tab--active' : ''"
                            @click="selectedCategory = cat.id">
                        <img x-show="cat.image" :src="cat.image" class="category-tab__img" alt="">
                        <span x-text="cat.nom"></span>
                    </button>
                </template>
            </div>
            
            <div class="pos-products__grid" id="product-grid">
                <template x-for="p in filteredProducts" :key="p.id">
                    <div class="product-card" :class="p.quantite_totale <= 0 ? 'product-card--out' : ''" 
                         @click="addToCart(p)">
                        <div class="product-card__info">
                            <strong x-text="p.nom"></strong>
                            <span class="product-card__price" x-text="formatPrice(p.prix_unitaire)"></span>
                            <span class="product-card__stock" x-text="'Stock: ' + p.quantite_totale"></span>
                        </div>
                    </div>
                </template>
            </div>
        </div>
        
        <div class="pos-cart">
            <div class="pos-cart__header">
                <h3>{% trans "Panier" %}</h3>
                <span class="badge" x-text="cart.length + ' articles'"></span>
            </div>
            
            <div class="pos-cart__form">
                <div class="field">
                    <label>{% trans "Client" %}</label>
                    <select class="input" x-model="selectedClient">
                        <option value="">{% trans "Sélectionner un client" %}</option>
                        {% for client in clients %}
                        <option value="{{ client.pk }}">{{ client.nom }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label>{% trans "Entrepôt" %}</label>
                    <select class="input" x-model="selectedWarehouse">
                        {% for entrepot in entrepots %}
                        <option value="{{ entrepot.pk }}">{{ entrepot.nom }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            
            <div class="pos-cart__items">
                <template x-for="(item, idx) in cart" :key="item.id">
                    <div class="cart-item">
                        <div class="cart-item__info">
                            <strong x-text="item.nom"></strong>
                            <span class="cart-item__price" x-text="formatPrice(item.prix_unitaire)"></span>
                        </div>
                        <div class="cart-item__qty">
                            <button class="icon-btn" @click="updateQuantity(idx, -1)">−</button>
                            <span x-text="item.quantity"></span>
                            <button class="icon-btn" @click="updateQuantity(idx, 1)">+</button>
                        </div>
                        <span class="cart-item__total" x-text="formatPrice(item.quantity * item.prix_unitaire)"></span>
                        <button class="icon-btn icon-btn--danger" @click="removeFromCart(idx)">🗑</button>
                    </div>
                </template>
                <template x-if="cart.length === 0">
                    <div class="empty-state">{% trans "Le panier est vide" %}</div>
                </template>
            </div>
            
            <div class="pos-cart__totals">
                <div class="pos-cart__row">
                    <span>{% trans "Sous-total" %}</span>
                    <span x-text="formatPrice(subtotal)"></span>
                </div>
                <div class="pos-cart__row pos-cart__row--total">
                    <strong>{% trans "Total" %}</strong>
                    <strong x-text="formatPrice(total)"></strong>
                </div>
            </div>
            
            <div class="pos-cart__actions">
                <button class="btn btn--ghost" @click="clearCart()">{% trans "Vider" %}</button>
                <button class="btn btn--primary btn--block" @click="checkout()" :disabled="cart.length === 0">
                    {% trans "Imprimer la facture" %}
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function posData() {
    return {
        products: [],
        categories: [],
        cart: [],
        searchQuery: '',
        selectedCategory: null,
        selectedClient: '',
        selectedWarehouse: '{% if entrepots %}{{ entrepots.0.pk }}{% endif %}',
        subtotal: 0,
        total: 0,
        
        init() {
            this.loadProducts();
            this.loadCategories();
            document.addEventListener('keydown', (e) => {
                if (e.ctrlKey && e.key === 'Enter') { this.checkout(); }
                if (e.key === 'Escape') { this.clearCart(); }
            });
        },
        
        loadProducts() {
            this.products = [
                {% for p in produits %}
                {
                    id: {{ p.pk }},
                    nom: "{{ p.nom|escapejs }}",
                    prix_unitaire: {{ p.prix_unitaire }},
                    quantite_totale: {{ p.quantite_totale|default:0 }},
                    categorie_id: {{ p.categorie.pk|default:"null" }},
                    image: {% if p.image %}"{{ p.image.url }}"{% else %}null{% endif %}
                }{% if not forloop.last %},{% endif %}
                {% endfor %}
            ];
        },
        
        loadCategories() {
            this.categories = [
                {% for c in categories %}
                {
                    id: {{ c.pk }},
                    nom: "{{ c.nom|escapejs }}",
                    image: {% if c.image %}"{{ c.image.url }}"{% else %}null{% endif %},
                    is_hero: {{ c.is_hero|yesno:"true,false" }}
                }{% if not forloop.last %},{% endif %}
                {% endfor %}
            ];
        },
        
        get filteredProducts() {
            return this.products.filter(p => {
                if (this.selectedCategory && p.categorie_id !== this.selectedCategory) return false;
                if (this.searchQuery && !p.nom.toLowerCase().includes(this.searchQuery.toLowerCase())) return false;
                return true;
            });
        },
        
        formatPrice(price) {
            return new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(price);
        },
        
        addToCart(product) {
            if (product.quantite_totale <= 0) return;
            const existing = this.cart.find(c => c.id === product.id);
            if (existing) {
                if (existing.quantity < product.quantite_totale) {
                    existing.quantity++;
                }
            } else {
                this.cart.push({ ...product, quantity: 1 });
            }
            this.calculateTotals();
        },
        
        updateQuantity(idx, delta) {
            const item = this.cart[idx];
            const newQty = item.quantity + delta;
            if (newQty <= 0) {
                this.cart.splice(idx, 1);
            } else if (newQty <= item.quantite_totale) {
                item.quantity = newQty;
            }
            this.calculateTotals();
        },
        
        removeFromCart(idx) {
            this.cart.splice(idx, 1);
            this.calculateTotals();
        },
        
        clearCart() {
            this.cart = [];
            this.calculateTotals();
        },
        
        calculateTotals() {
            this.subtotal = this.cart.reduce((sum, i) => sum + (i.prix_unitaire * i.quantity), 0);
            this.total = this.subtotal;
        },
        
        async checkout() {
            if (this.cart.length === 0 || !this.selectedClient) {
                alert('{% trans "Veuillez sélectionner un client et ajouter des produits." %}');
                return;
            }
            
            const response = await fetch('{% url "orders:pos_create" %}', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
                body: JSON.stringify({
                    client_id: this.selectedClient,
                    entrepot_id: this.selectedWarehouse,
                    items: this.cart.map(c => ({ id: c.id, quantity: c.quantity }))
                })
            });
            
            if (response.ok) {
                const html = await response.text();
                document.body.insertAdjacentHTML('beforeend', html);
                setTimeout(() => window.print(), 500);
                this.clearCart();
            } else {
                alert('{% trans "Erreur lors de la création de la commande." %}');
            }
        }
    }
}
</script>
{% endblock %}
