{% load i18n %}
<div class="modal-overlay" x-data="{ open: true }" x-show="open" x-init="open = true" x-transition.opacity>
    <div class="modal-panel" x-transition:enter="modal-in" @click.outside="open = false; $el.closest('.modal-overlay').remove()">
        <div class="modal-panel__header">
            <h2>{% if produit %}{% trans "Modifier le produit" %}{% else %}{% trans "Nouveau produit" %}{% endif %}</h2>
            <button type="button" class="icon-btn" @click="open = false; $el.closest('.modal-overlay').remove()">✕</button>
        </div>
        <form
            class="modal-panel__body form-grid"
            hx-post="{% if produit %}{% url 'inventory:product_edit' produit.pk %}{% else %}{% url 'inventory:product_create' %}{% endif %}"
            hx-target="#modal-region"
            hx-swap="innerHTML"
        >
            {% csrf_token %}
            {% for field in form %}
            <div class="field {% if field.name == 'description' %}field--full{% endif %}">
                <label class="field-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<span class="field-error">{{ field.errors|striptags }}</span>{% endif %}
            </div>
            {% endfor %}
            <div class="modal-panel__footer field--full">
                <button type="button" class="btn btn--ghost" @click="open = false; $el.closest('.modal-overlay').remove()">{% trans "Annuler" %}</button>
                <button type="submit" class="btn btn--primary">{% trans "Enregistrer" %}</button>
            </div>
        </form>
    </div>
</div>
