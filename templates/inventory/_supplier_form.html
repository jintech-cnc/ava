{% load i18n %}
<div class="modal-overlay" x-data="{ open: true }" x-show="open" x-init="open = true" x-transition.opacity>
    <div class="modal-panel modal-panel--lg" x-transition:enter="modal-in" @click.outside="open = false; $el.closest('.modal-overlay').remove()">
        <div class="modal-panel__header">
            <h2>{% if supplier %}{% trans "Modifier le fournisseur" %}{% else %}{% trans "Nouveau fournisseur" %}{% endif %}</h2>
            <button type="button" class="icon-btn" @click="open = false; $el.closest('.modal-overlay').remove()">✕</button>
        </div>
        <form
            class="form-grid"
            hx-post="{% if supplier %}{% url 'inventory:supplier_edit' supplier.pk %}{% else %}{% url 'inventory:supplier_create' %}{% endif %}"
            hx-target="#modal-region"
            hx-swap="innerHTML"
        >
            {% csrf_token %}
            {% for field in form %}
            <div class="field {% if field.name == 'adresse' or field.name == 'notes' %}field--full{% endif %}">
                <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}{% for error in field.errors %}<span class="field-error">{{ error|striptags }}</span>{% endfor %}{% endif %}
            </div>
            {% endfor %}
            <div class="modal-panel__footer field--full">
                <button type="button" class="btn btn--ghost" @click="open = false; $el.closest('.modal-overlay').remove()">{% trans "Annuler" %}</button>
                <button type="submit" class="btn btn--primary">{% trans "Enregistrer" %}</button>
            </div>
        </form>
    </div>
</div>
