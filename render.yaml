# render.yaml — Déploiement Ava sur Render.com avec Neon PostgreSQL
# https://render.com/docs/deploy-to-render

services:
  - type: web
    name: ava
    env: python
    region: oregon
    plan: free
    # Le repo contient un sous-dossier "ava/" avec le code Django
    rootDir: ava
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        # Mets ton domaine Render ici une fois déployé : ava.onrender.com
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        # Connection string Neon — remplace par la tienne si nécessaire
        # Format: postgresql://user:pass@host/dbname?sslmode=require
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@ava.local
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
        # IMPORTANT: va dans le dashboard Render et remplace par ton vrai mot de passe

# La base de données est gérée par Neon (neon.tech).
# Configure DATABASE_URL directement dans le dashboard Render :
# postgresql://neondb_owner:<MOT_DE_PASSE>@ep-green-boat-aefnperc-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require
