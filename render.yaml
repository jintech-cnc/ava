# render.yaml — Déploiement Ava sur Render.com
# https://render.com/docs/deploy-to-render

services:
  - type: web
    name: ava
    env: python
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        # Mets ton domaine Render ici une fois déployé : ava.onrender.com
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: ava-db
          property: connectionString

databases:
  - name: ava-db
    plan: free
    databaseName: ava_db
    ipAllowList: []
